[project]
name = "chota-py"
version = "0.0.1"
description = "Reference + ad-hoc Python scripts alongside the chota-bot SvelteKit app. Not part of the running kiosk."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.2",
    "pytransportnswv2>=2.2.6",
    "typer>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.15",
]
